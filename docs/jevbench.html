<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JevBench boards, with Microsoft-Decision-1 highlighted</title>
<link rel="icon" href="data:,"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Chewy&display=swap" rel="stylesheet">
<link rel="stylesheet" href="board.css">
<style>
.top{max-width:1180px;margin:0 auto;padding:28px 18px 6px}
.top h1{font-family:var(--display);font-size:34px;margin:0 0 6px}
.top p{margin:4px 0;color:var(--soft);font-size:15px;max-width:900px}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 40px}
.wrap h2{font-family:var(--display);font-size:24px;margin:26px 0 8px}
tr.ours td{background:var(--paper)}
.rng{font-family:var(--mono);font-size:11px;color:var(--soft);display:block}
</style></head>
<body>
<div class="top">
<h1>JevBench boards</h1>
<p>Snapshot of the live <a href="https://benchmarkheaven.com/jev-models/api" target="_blank" rel="noopener">JevBench</a> boards, in the board's own order, with Microsoft-Decision-1 highlighted.</p>
<p id="status" class="foot"></p>
</div>
<main class="wrap"><div id="table"><div id="app"></div></div></main>
<script>
const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const one=n=>n==null?'—':Number(n).toFixed(1);
(async()=>{
 const J=await fetch('data/jevbench-boards.json').then(r=>r.json());
 const section=(rows,title,scoreLabel)=>{
  const ranked=rows.filter(r=>r.score!=null).sort((a,b)=>b.score-a.score);
  let n=0;
  const body=ranked.map(r=>{const ours=/Microsoft-Decision-1/.test(r.name);const unranked=r.flags.includes('not ranked')||r.score===0;if(!unranked)n++;
   return `<tr class="${ours?'ours':''}"><td class="r"><span class="rank">${unranked?'—':n}</span></td>
   <td><div class="bm">${esc(r.name)}</div>${r.flags.length?`<div class="bm-sub"><span class="pill">${esc(r.flags.join(', '))}</span></div>`:''}</td>
   <td class="r"><span class="score big">${one(r.score)}</span>${r.ci?`<span class="rng">${one(r.ci[0])} to ${one(r.ci[1])}</span>`:''}</td>
   <td class="r"><span class="mono">${one(r.intelligence)}</span></td><td class="r"><span class="mono">${one(r.calibration)}</span></td><td class="r"><span class="mono">${one(r.speed)}</span></td><td class="r"><span class="mono">${one(r.cost)}</span></td></tr>`}).join('');
  return `<h2>${title}</h2><div class="table-scroll"><table><thead><tr><th class="r">#</th><th>system</th><th class="r">${scoreLabel}</th><th class="r">intelligence</th><th class="r">calibration</th><th class="r">speed</th><th class="r">cost</th></tr></thead><tbody>${body}</tbody></table></div>`;
 };
 $('#app').innerHTML=section(J.api,'Hosted API board','Composite')+section(J.open,'Open-weights board','Capability');
 $('#status').textContent=`Fetched ${J.fetched} · ${J.api.length} API systems · ${J.open.length} open-weights systems`;
})().catch(e=>{$('#status').textContent='Could not load the snapshot: '+e});
</script>
</body></html>
