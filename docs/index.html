<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decision Index, public benchmarks, with Microsoft-Decision-1</title>
<meta name="description" content="The Jev Decision Index public-only ranking, fetched live, with Microsoft-Decision-1's public-suite score inserted.">
<link rel="icon" href="data:,"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Chewy&display=swap" rel="stylesheet">
<link rel="stylesheet" href="board.css">
<style>
/* additions */
.top{max-width:1180px;margin:0 auto;padding:28px 18px 6px}
.top h1{font-family:var(--display);font-size:34px;margin:0 0 6px;letter-spacing:.2px}
.top p{margin:4px 0;color:var(--soft);font-size:15px;max-width:900px}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 40px}
tr.ours td{background:var(--paper)}
tr.ours .bm a{color:var(--ink)}
.foot{font-size:12.5px;color:var(--soft);margin-top:14px}
</style></head>
<body>
<div class="top">
<h1>Decision Index, public benchmarks</h1>
<p>Live mirror of the <a href="https://huggingface.co/spaces/multimodalart/jev-decision-index" target="_blank" rel="noopener">Jev Decision Index</a> plus Microsoft-Decision-1 and SnapJudge.</p>
<p><a href="https://benchmarkheaven.com/jev-models" target="_blank" rel="noopener">JevBench</a> · <a href="jevbench.html">JevBench boards with Microsoft-Decision-1</a></p>
<p id="status" class="foot" hidden></p>
</div>
<main class="wrap"><div id="table"><div id="app"></div></div></main>
<script>
const BASE='https://multimodalart-jev-decision-index.static.hf.space';
const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=n=>n==null?'—':(n*100).toFixed(1)+'%';
const ms=n=>n==null?'—':n>=1000?(n/1000).toFixed(2)+' s':Math.round(n)+' ms';
const size=n=>n==null?'—':n>=1e9?(n/1e9).toFixed(n>=1e10?0:1)+'B':n>=1e6?(n/1e6).toFixed(0)+'M':String(n);
const one=n=>{if(n==null)return '—';const t=Number(n).toFixed(1);return t==='-0.0'?'0.0':t};
const ARCH={'autoregressive':'a-ar','diffusion':'a-diff','encoder':'a-enc','GLi family':'a-gli'};
const KINDC={'inference technique':'k-tech','full fine-tune':'k-full','fine-tune':'k-full','LoRA':'k-lora','LoRA + head':'k-lora','head / adapter':'k-head','pre-trained':'k-pre'};
const KINDCOL={'k-tech':'#3B7CF6','k-full':'#A855F7','k-lora':'#3E8E5E','k-head':'#FF9D00','k-pre':'#bbbbbb','k-jev':'#232323','k-other':'#bbbbbb'};
const kindOf=r=>r.jev?'k-jev':(KINDC[r.meta?.kind]||'k-other');
const colorOf=r=>KINDCOL[kindOf(r)];
const archOf=r=>r.jev?'a-jev':(ARCH[r.meta?.technique]||'a-other');
const info=text=>`<span class="infowrap"><button type="button" class="info" aria-label="Why">i</button><span class="tipbox">${text}</span></span>`;
const orgImg=r=>{const o=r.meta&&r.meta.org;if(!o||!o.logo)return '';const src=o.logo.startsWith('http')?o.logo:BASE+'/'+o.logo;return `<img class="orglogo" src="${esc(src)}" alt="${esc(o.name)}" title="by ${esc(o.name)}" loading="lazy" width="16" height="16">`};
const wnSup=r=>{const n=r.meta&&r.meta.weights_note;return n?`<span class="infowrap wninfo"><button type="button" class="info" aria-label="${esc(n)}" title="${esc(n)}">i</button><span class="tipbox">${esc(n)}</span></span>`:''};
const newPill=r=>r.meta&&r.meta.new?'<span class="pill newpill" title="New on the board in the latest batch">new</span>':'';
function pills(r){
 if(r.jev)return '<span class="pill k-jev">reference</span>';
 const m=r.meta||{};const out=[];
 if(m.kind)out.push(`<span class="pill ${KINDC[m.kind]||''}">${esc(m.kind)}</span>`);
 const links=[];
 if(m.model_url)links.push(`<a href="${esc(m.model_url)}" target="_blank" rel="noopener">model ↗</a>`);
 if(m.code_url)links.push(`<a href="${esc(m.code_url)}" target="_blank" rel="noopener">code ↗</a>`);
 if(links.length)out.push(links.join(' · '));
 if(m.base_model){out.push(`<span class="from">from ${m.base_url?`<a href="${esc(m.base_url)}" target="_blank" rel="noopener">${esc(m.base_model)}</a>`:esc(m.base_model)} <span class="tag" title="${esc(m.technique_name||m.technique||'')}"><i class="${archOf(r)}"></i>${esc(m.technique||'')}</span></span>`)}
 else if(m.technique)out.push(`<span class="tag" title="${esc(m.technique_name||m.technique)}"><i class="${archOf(r)}"></i>${esc(m.technique)}</span>`);
 return out.join('');
}
function sizeCell(r){
 if(r.jev)return '<span class="muted">undisclosed</span>';
 const m=r.meta;if(!m||m.served_params==null)return '<span class="muted">—</span>';
 const soft=m.params_from_name||m.params_estimated;
 return `<span class="mono" title="${soft?'derived from the model name':'from the weights'}">${soft?'~':''}${size(m.served_params)}</span>`;
}
const areaVal=(r,id)=>{const c=r.categories&&r.categories.find(x=>x.id===id);return c&&c.skill!=null?c.skill*100:null};
function rankOf(rows,T){
 const r=rows.filter(x=>x.score!=null).slice().sort((a,b)=>b.score-a.score);const o={};let start=0,g=1;
 r.forEach((x,i)=>{if(i>0&&Math.round(r[start].score*100)/100-Math.round(x.score*100)/100>T+1e-9){start=i;g++}o[x.engine]=g});
 const counts={};Object.values(o).forEach(v=>counts[v]=(counts[v]||0)+1);
 for(const e in o)o[e]={n:o[e],tied:counts[o[e]]>1};return o;
}
const rankText=rk=>rk?(rk.tied?`=${rk.n}`:String(rk.n)):'—';
async function getJSON(path){
 try{const r=await fetch(BASE+'/'+path,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return {data:await r.json(),live:true}}
 catch(e){const r=await fetch(path.replace(/^data\//,'data/'));return {data:await r.json(),live:false}}
}
(async()=>{
 const [I,V,R]=await Promise.all([getJSON('data/index.json'),getJSON('data/v03.json'),fetch('data/runs.json').then(r=>r.json())]);
 const D=I.data,V3=V.data,T=(V3.formula&&V3.formula.tie_band)||0.9;
 const AREAS=D.categories.filter(c=>!c.jev_only);
 const rows=D.models.map(m=>({engine:m.engine,name:m.name,variant:m.variant,meta:m.meta,categories:m.categories,ece:m.calibration?m.calibration.ece*100:null,
   coverage:D.suite.requests?(m.counts.ok||0)/D.suite.requests:null,latency:m.latency&&m.latency.median,latnote:m.latency&&m.latency.note,score:m.scores.public_skill,notes:m.notes||[],contam:(m.contamination||[]).map(c=>c.flag)}));
 rows.push({engine:'jev',jev:true,name:'Jev',meta:null,categories:D.jev.categories,ece:D.jev.calibration?D.jev.calibration.ece*100:null,coverage:1,latency:D.jev.latency.median,latnote:D.jev.latency.note,score:D.jev.scores.public_skill,notes:[],contam:[]});
 for(const u of R.runs)rows.push({engine:u.engine,name:u.name,ours:true,meta:u.meta,categories:u.categories,ece:u.ece,coverage:D.suite.requests&&u.counts.ok!=null?u.counts.ok/D.suite.requests:null,latency:u.latency&&u.latency.median,latnote:u.latency&&u.latency.note,score:u.pub,notes:[],contam:[]});
 const rank=rankOf(rows,T);
 const sorted=rows.filter(r=>r.score!=null).sort((a,b)=>b.score-a.score);
 const body=sorted.map(r=>`<tr class="${r.jev?'jev':''}${r.ours?' ours':''}" data-engine="${esc(r.engine)}">
  <td class="r"><span class="rank" title="${rank[r.engine]?.tied?`tied: within ${T} points of the first model in its group`:''}">${rankText(rank[r.engine])}</span></td>
  <td><div class="bm"><span class="swatch" style="background:${colorOf(r)}"></span>${orgImg(r)}<a href="${r.ours?'https://github.com/Yuncun/benchmarks':'https://huggingface.co/spaces/multimodalart/jev-decision-index?model='+encodeURIComponent(r.engine)}" target="_blank" rel="noopener">${esc(r.name)}</a>${wnSup(r)}${[...r.contam,...r.notes].length?info([...r.contam,...r.notes].map(esc).join('<br>')):''}${newPill(r)}</div>${r.variant?`<span class="variant">${esc(r.variant)}</span>`:''}<div class="bm-sub">${pills(r)}</div></td>
  <td class="r"><span class="score big">${one(r.score)}</span></td>
  ${AREAS.map(c=>`<td class="r"><span class="mono">${one(areaVal(r,c.id))}</span></td>`).join('')}
  <td class="r"><span class="mono">${r.ece==null?'—':r.ece.toFixed(1)}</span></td>
  <td class="r">${sizeCell(r)}</td>
  <td class="r"><span class="mono">${pct(r.coverage)}</span></td>
  <td class="r"><span class="mono" title="${esc(r.latnote||'')}">${ms(r.latency)}</span></td></tr>`).join('');
 const head=`<tr><th class="r">#</th><th>model</th><th class="r">Public only</th>${AREAS.map(c=>`<th class="r">${esc(c.label.split(/\s*&\s*|\s+/)[0])}</th>`).join('')}<th class="r">calibration</th><th class="r">size</th><th class="r">answered</th><th class="r">latency</th></tr>`;
 $('#app').innerHTML=`<div class="table-scroll"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
 const ours=R.runs.map(u=>`${esc(u.name)}: ${rankText(rank[u.engine])} of ${sorted.length}, public index ${one(u.pub)}`).join('; ');
})().catch(e=>{const st=$('#status');st.hidden=false;st.textContent='Could not load the board data: '+e});
</script>
</body></html>
