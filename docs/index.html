<div class="top">
<h1>Decision Index, public benchmarks</h1>
<p>Live mirror of the <a href="https://huggingface.co/spaces/multimodalart/jev-decision-index" target="_blank" rel="noopener">Jev Decision Index</a> plus Microsoft-Decision-1 and SnapJudge.</p>

<script>
const BASE='https://multimodalart-jev-decision-index.static.hf.space';
const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=n=>n==null?'—':(n*100).toFixed(1)+'%';
const ms=n=>n==null?'—':n>=1000?(n/1000).toFixed(2)+' s':Math.round(n)+' ms';
const size=n=>n==null?'—':n>=1e9?(n/1e9).toFixed(n>=1e10?0:1)+'B':n>=1e6?(n/1e6).toFixed(0)+'M':String(n);
const one=n=>{if(n==null)return '—';const t=Number(n).toFixed(1);return t==='-0.0'?'0.0':t};

const KINDCOL={'k-tech':'#3B7CF6','k-full':'#A855F7','k-lora':'#3E8E5E','k-head':'#FF9D00','k-pre':'#bbbbbb','k-jev':'#232323','k-other':'#bbbbbb'};
const kindOf=r=>r.jev?'k-jev':(KINDC[r.meta?.kind]||'k-other');
const colorOf=r=>KINDCOL[kindOf(r)];

const orgImg=r=>{const o=r.meta&&r.meta.org;if(!o||!o.logo)return '';const src=o.logo.startsWith('http')?o.logo:BASE+'/'+o.logo;return `<img class="orglogo" src="${esc(src)}" alt="${esc(o.name)}" title="by ${esc(o.name)}" loading="lazy" width="16" height="16">`};

 if(r.jev)return '<span class="pill k-jev">reference</span>';

 const D=I.data,V3=V.data,T=(V3.formula&&V3.formula.tie_band)||0.9;
 const AREAS=D.categories.filter(c=>!c.jev_only);
 const rows=D.models.map(m=>({engine:m.engine,name:m.name,variant:m.variant,meta:m.meta,categories:m.categories,ece:m.calibration?m.calibration.ece*100:null,
   coverage:D.suite.requests?(m.counts.ok||0)/D.suite.requests:null,latency:m.latency&&m.latency.median,latnote:m.latency&&m.latency.note,score:m.scores.public_skill,notes:m.notes||[],contam:(m.contamination||[]).map(c=>c.flag)}));
 rows.push({engine:'jev',jev:true,name:'Jev',meta:null,categories:D.jev.categories,ece:D.jev.calibration?D.jev.calibration.ece*100:null,coverage:1,latency:D.jev.latency.median,latnote:D.jev.latency.note,score:D.jev.scores.public_skill,notes:[],contam:[]});
 for(const u of R.runs)rows.push({engine:u.engine,name:u.name,ours:true,meta:u.meta,categories:u.categories,ece:u.ece,coverage:D.suite.requests&&u.counts.ok!=null?u.counts.ok/D.suite.requests:null,latency:u.latency&&u.latency.median,latnote:u.latency&&u.latency.note,score:u.pub,notes:[],contam:[]});
 const rank=rankOf(rows,T);
 const sorted=rows.filter(r=>r.score!=null).sort((a,b)=>b.score-a.score);
 const body=sorted.map(r=>`<tr class="${r.jev?'jev':''}${r.ours?' ours':''}" data-engine="${esc(r.engine)}">
  <td class="r"><span class="rank" title="${rank[r.engine]?.tied?`tied: within ${T} points of the first model in its group`:''}">${rankText(rank[r.engine])}</span></td>
  <td><div class="bm"><span class="swatch" style="background:${colorOf(r)}"></span>${orgImg(r)}<a href="${r.ours?'https://github.com/Yuncun/benchmarks':'https://huggingface.co/spaces/multimodalart/jev-decision-index?model='+encodeURIComponent(r.engine)}" target="_blank" rel="noopener">${esc(r.name)}</a>${wnSup(r)}${[...r.contam,...r.notes].length?info([...r.contam,...r.notes].map(esc).join('<br>')):''}${newPill(r)}</div>${r.variant?`<span class="variant">${esc(r.variant)}</span>`:''}<div class="bm-sub">${pills(r)}</div></td>
  <td class="r"><span class="score big">${one(r.score)}</span></td>
  ${AREAS.map(c=>`<td class="r"><span class="mono">${one(areaVal(r,c.id))}</span></td>`).join('')}
  <td class="r"><span class="mono">${r.ece==null?'—':r.ece.toFixed(1)}</span></td>
  <td class="r">${sizeCell(r)}</td>
  <td class="r"><span class="mono">${pct(r.coverage)}</span></td>
  <td class="r"><span class="mono" title="${esc(r.latnote||'')}">${ms(r.latency)}</span></td></tr>`).join('');
 const head=`<tr><th class="r">#</th><th>model</th><th class="r">Public only</th>${AREAS.map(c=>`<th class="r">${esc(c.label.split(/\s*&\s*|\s+/)[0])}</th>`).join('')}<th class="r">calibration</th><th class="r">size</th><th class="r">answered</th><th class="r">latency</th></tr>`;
 $('#app').innerHTML=`<div class="table-scroll"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
 const ours=R.runs.map(u=>`${esc(u.name)}: ${rankText(rank[u.engine])} of ${sorted.length}, public index ${one(u.pub)}`).join('; ');
})().catch(e=>{const st=$('#status');st.hidden=false;st.textContent='Could not load the board data: '+e});
</script>
</body></html>
